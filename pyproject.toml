[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jingniflow"
version = "0.2.0.dev0"
description = "JingniFlow是一个基于Python的量化交易开发框架，致力于提供兼容中国券商交易软件的量化解决方案。"
readme = "README.md"
authors = [
    { name = "Hanjun Du", email = "hanjun.du@outlook.com" }
]
license = { text = "MIT" }
keywords = [
    "quantitative trading", 
    "stock trading", 
    "quant framework", 
    "中国券商"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.6"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage>=7.0",
    "pyflakes>=3.0",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/duhanjun/JingniFlow"
Repository = "https://github.com/duhanjun/JingniFlow.git"
Issues = "https://github.com/duhanjun/JingniFlow/issues"

[tool.setuptools.packages.find]
include = ["jingniflow*"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line-length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"

# 覆盖率门禁只约束无平台依赖的核心契约层（core/），不把平台适配器
# 的未走分支冒充成整体覆盖率。全包覆盖率另行报告。
[tool.coverage.run]
source = ["jingniflow/core"]

[tool.coverage.report]
include = ["jingniflow/core/*"]
fail_under = 80
show_missing = true
